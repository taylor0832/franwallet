<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Email preferences · FranWallet</title><style>body{margin:0;background:#f4f7f6;color:#173c3b;font:16px/1.6 system-ui,sans-serif}main{max-width:520px;margin:10vh auto;padding:24px}h1{font-size:32px;line-height:1.2}button,a{font:inherit}button{border:0;border-radius:8px;background:#173c3b;color:white;min-height:48px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.6}a{color:#173c3b}button:focus-visible,a:focus-visible{outline:3px solid #a14e2e;outline-offset:4px}</style></head><body><main><p><strong>FranWallet</strong></p><h1>Your inbox, your choice.</h1><p>Stop optional setup reminders. This does not affect your account, saved records, or sign-in emails.</p><button id="stop" type="button">Stop setup reminders</button><p id="status" role="status"></p><a href="wallet.html">Return to my wallet →</a></main><script>
(()=>{'use strict';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const button=document.getElementById('stop'),status=document.getElementById('status');if(!/^[a-f0-9-]{36}$/i.test(token)){button.hidden=true;status.textContent='Open this page from a reminder email, or manage reminders inside your wallet.';return;}button.onclick=async()=>{button.disabled=true;status.textContent='Saving…';try{const r=await fetch('https://nlshvthmcnwuygaeague.supabase.co/functions/v1/onboarding?unsubscribe='+encodeURIComponent(token),{method:'POST',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error();status.textContent='Setup reminders are off. Your wallet is right where you left it.';button.hidden=true;}catch{status.textContent='We could not save that change. Please try again.';status.setAttribute('role','alert');button.disabled=false;}};})();
</script></body></html>
