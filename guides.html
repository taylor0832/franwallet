/* Minimal markdown → HTML for our own guide files (headings, lists, bold/italic, links, hr). */
function mdToHtml(md){
  const esc = (s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = (s)=> s
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = md.split('\n');
  let html='', list=null, para=[];
  const flushPara=()=>{ if(para.length){ html+='<p>'+inline(esc(para.join(' ')))+'</p>'; para=[]; } };
  const flushList=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  for(const raw of lines){
    const l = raw.trimEnd();
    if(/^---+$/.test(l.trim())){ flushPara(); flushList(); html+='<hr>'; continue; }
    if(/^### /.test(l)){ flushPara(); flushList(); html+='<h3>'+inline(esc(l.slice(4)))+'</h3>'; continue; }
    if(/^## /.test(l)){ flushPara(); flushList(); html+='<h2>'+inline(esc(l.slice(3)))+'</h2>'; continue; }
    if(/^# /.test(l)){ flushPara(); flushList(); html+='<h1>'+inline(esc(l.slice(2)))+'</h1>'; continue; }
    if(/^[-*] /.test(l)){ flushPara(); if(list!=='ul'){ flushList(); html+='<ul>'; list='ul'; } html+='<li>'+inline(esc(l.slice(2)))+'</li>'; continue; }
    if(/^\d+\. /.test(l)){ flushPara(); if(list!=='ol'){ flushList(); html+='<ol>'; list='ol'; } html+='<li>'+inline(esc(l.replace(/^\d+\. /,'')))+'</li>'; continue; }
    if(l.trim()===''){ flushPara(); flushList(); continue; }
    para.push(l.trim());
  }
  flushPara(); flushList();
  return html;
}

}
