<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'DM Sans',sans-serif;
    background:radial-gradient(120% 120% at 80% 0%, #1A6B6B 0%, #0F4747 38%, #08312F 100%);
    color:#fff;position:relative;display:flex;flex-direction:column;justify-content:center;
    padding:74px 80px;
  }
  .glow{position:absolute;top:-180px;right:-120px;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,115,74,.28), transparent 62%);pointer-events:none}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:40px;position:relative;z-index:2}
  .mark{width:78px;height:78px;border-radius:18px;
    background:linear-gradient(160deg,#217676,#0A3D3D);position:relative;
    box-shadow:0 14px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18)}
  .mark svg{position:absolute;inset:0}
  .brand .name{font-family:'Fraunces',serif;font-weight:700;font-size:40px;letter-spacing:-.5px}
  .brand .tag{font-size:18px;color:rgba(255,255,255,.55);font-weight:500;margin-left:4px}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:74px;line-height:1.04;letter-spacing:-1.5px;
    max-width:920px;position:relative;z-index:2;margin-bottom:26px}
  h1 .accent{color:#FFB088}
  p{font-size:27px;line-height:1.45;color:rgba(255,255,255,.8);max-width:840px;position:relative;z-index:2}
  .chips{display:flex;gap:12px;margin-top:42px;position:relative;z-index:2}
  .chip{font-size:18px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:30px;padding:11px 20px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80}
  .url{position:absolute;bottom:54px;right:80px;font-size:20px;font-weight:600;color:rgba(255,255,255,.55);z-index:2}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 64 64"><path d="M18 13 H46 V22 H27 V30 H42 V38 H27 V52 H18 Z" fill="#fff"/><circle cx="44" cy="49" r="3.2" fill="#E8734A"/></svg>
    </div>
    <span class="name">Fran</span><span class="tag">· the Franchise Wallet</span>
  </div>
  <h1>Start, run &amp; renew<br/>your franchise — <span class="accent">in one Wallet.</span></h1>
  <p>Entity, banking, books, insurance, payroll &amp; compliance. Built for first-time franchise owners. Free to start.</p>
  <div class="chips">
    <span class="chip"><span class="dot"></span>Live demo · no signup</span>
    <span class="chip">🤝 5 specialists on your team</span>
    <span class="chip">🎁 $15,420 in partner perks</span>
  </div>
  <div class="url">franwallet.com</div>
</body>
</html>
